# ReviewTicket 백엔드 설정
#
# 비밀번호는 여기 넣지 않는다 -> application-local.yml (git 제외 대상)
# 팀원은 application-local.yml.example 을 복사해서 쓴다.

spring:
  application:
    name: reviewticket-server

  profiles:
    # local 프로필이 application-local.yml 을 읽어 비밀번호를 채운다
    active: local

  datasource:
    url: jdbc:mysql://localhost:3306/reviewticket
    username: reviewticket
    # password 는 application-local.yml 에 있다

  jpa:
    hibernate:
      # 스키마는 BackEnd/DB/*.sql 로 직접 관리한다. Spring 이 표를 만들거나 바꾸지 않는다.
      # validate = 뜰 때 엔티티와 실제 표가 다르면 즉시 에러. 조용히 어긋나는 걸 막는다.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
    # dialect 는 일부러 적지 않는다 — Boot 4/Hibernate 7 에서 MySQL8Dialect 같은
    # 버전별 이름이 제거됐다. 안 적으면 드라이버가 알아서 감지한다.

  servlet:
    multipart:
      max-file-size: 15MB       # 4K 폰 사진 대응
      max-request-size: 20MB    # 안 잡으면 기본 10MB 에 먼저 걸린다
      file-size-threshold: 1MB  # 초과분은 Tomcat 임시파일로 (요청 끝나면 자동 삭제)

server:
  port: 8080
  tomcat:
    threads:
      max: 100                  # 기본 200 은 이 서버엔 과하다

# ---- 이 서비스 전용 설정 ----
reviewticket:
  # 업로드된 리뷰 사진 저장 위치. 나중에 딴 디스크로 옮기려면 이 한 줄만 고친다.
  upload-dir: ./Uploaded_pictures
  # 거부된 업로드를 사람이 읽을 수 있는 텍스트로도 남긴다 (DB 와 별개).
  # 날짜별 파일이 쌓인다: 2026-07-29.log
  failure-log-dir: ../DB/Upload_Failure_log
  # 팀원 프로토타입을 /demo 로 서빙한다 (같은 출처라 CORS 가 필요 없다)
  demo-dir: ../../FrontEnd/Demo
  ai:
    # 지금은 FastAPI 직통. Spring 이 판정 주체라는 구조는 그대로다.
    base-url: http://localhost:8000
    # P(non_food) >= tau 면 '음식 아님'. 최대 확률에는 임계값을 걸지 않는다.
    tau: 0.10
  auth:
    # jwt-secret 은 application-local.yml 에 있다 (32바이트 이상)
    # 로그인 유지 기간. 짧게 잡을 이유가 없다 — 비밀번호를 바꾸면
    # token_version 이 올라가 옛 토큰이 즉시 죽기 때문이다.
    token-ttl: 12h
    # 이메일 인증 링크 유효 기간
    verification-ttl: 30m
    # 인증 메일에 넣을 링크의 앞부분. 팀원 브라우저가 여는 주소여야 하므로
    # localhost 로 두면 안 된다. Tailscale 주소를 쓴다.
    base-url: http://100.119.108.80:8080
  mail:
    # 발신 주소. 비우면 메일을 보내지 않고 인증 링크를 로그에 남긴다.
    # 실제 발송하려면 여기와 application-local.yml 의 spring.mail 을 채운다.
    from: ""
  cors:
    # 프론트엔드를 Spring 이 아닌 다른 곳에서 띄울 때 필요한 허용 출처.
    # /demo 로 서빙하는 경우는 같은 출처라 이 목록과 무관하다.
    # 포트가 다르면 다른 출처다 — Vite(5173), Live Server(5500) 등을 넣어둔다.
    allowed-origins:
      - "http://localhost:*"
      - "http://127.0.0.1:*"
      # 팀원이 자기 PC 에서 프론트를 띄우고 이 서버를 호출하는 경우.
      # 사설망 대역을 통째로 허용해 둔다.
      - "http://192.168.*:*"
      - "http://172.*:*"
      - "http://10.*:*"
  duplicate:
    # pHash 해밍 거리가 이 값 이하면 같은 사진으로 본다.
    # 우리 구현으로 실측한 값 (ImageHasherTest): 압축·리사이즈·밝기 변형은
    # 최대 4, 가장자리 크롭은 18, 서로 다른 사진 20장의 최소 거리는 22.
    # 8 은 그 사이라 양쪽 모두 여유가 있다.
    phash-threshold: 8

logging:
  level:
    org.hibernate.SQL: debug
