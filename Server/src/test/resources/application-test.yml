# 테스트 전용 설정.
#
# 테스트는 reviews / ai_rejections 를 비우므로 실서비스 DB 에 붙으면 안 된다.
# 여기서 DB 이름과 파일 경로만 갈아끼운다. 비밀번호 등 나머지는 local 프로필
# (application-local.yml) 것을 그대로 쓴다 — 테스트 클래스가 두 프로필을 함께
# 활성화한다: @ActiveProfiles({"local", "test"})
#
# 준비: BackEnd/DB/03_test_database.sql 을 먼저 한 번 실행해 DB 를 만든다.

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/reviewticket_test

reviewticket:
  # build/ 아래로 보내 실제 업로드 폴더와 로그를 건드리지 않게 한다.
  upload-dir: ./build/test-uploads
  failure-log-dir: ./build/test-failure-log
