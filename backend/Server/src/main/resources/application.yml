# ReviewTicket 백엔드 설정
#
# 비밀번호는 여기 넣지 않는다 -> application-local.yml (git 제외 대상)
# 팀원은 application-local.yml.example 을 복사해서 쓴다.

spring:
  application:
    name: reviewticket-server

  profiles:
    # local 프로필이 application-local.yml 을 읽어 비밀번호를 채운다
    active: local

  datasource:
    url: jdbc:mysql://localhost:21096/reviewticket
    username: reviewticket
    # password 는 application-local.yml 에 있다

  jpa:
    hibernate:
      # 스키마는 BackEnd/DB/*.sql 로 직접 관리한다. Spring 이 표를 만들거나 바꾸지 않는다.
      # validate = 뜰 때 엔티티와 실제 표가 다르면 즉시 에러. 조용히 어긋나는 걸 막는다.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
    # dialect 는 일부러 적지 않는다 — Boot 4/Hibernate 7 에서 MySQL8Dialect 같은
    # 버전별 이름이 제거됐다. 안 적으면 드라이버가 알아서 감지한다.

  servlet:
    multipart:
      # 리뷰 사진의 상한(15MB)에 맞춘다. 이보다 작으면 정상 사진도 튕겨 나가고,
      # 기본값(1MB)을 그대로 두면 휴대폰 사진 대부분이 이 값보다 커서 막힌다.
      max-file-size: 15MB
      max-request-size: 16MB

  # 시각 형식은 따로 설정하지 않는다.
  #
  # Boot 4 는 Jackson 3(tools.jackson)을 쓰는데, 거기서는 날짜를 ISO 8601
  # 문자열로 내보내는 것이 기본이다. Jackson 2 에서 쓰던
  # spring.jackson.serialization.write-dates-as-timestamps 는 그 자리에
  # 더 이상 없어서, 적어 두면 기동 자체가 실패한다.
  #
  # 주문 API 의 시각은 Instant 로 내보내므로 "2026-08-04T09:30:00Z" 형태가 된다.

server:
  port: 60921
  tomcat:
    threads:
      max: 100 # 기본 200 은 이 서버엔 과하다

# ---- 이 서비스 전용 설정 ----
reviewticket:
  # 팀원 프로토타입을 /demo 로 서빙한다 (같은 출처라 CORS 가 필요 없다)
  # Vite 프로젝트의 빌드 산출물. `FrontEnd/Login_design`에서 npm run build 후 생성된다.
  demo-dir: ../../FrontEnd/Login_design/dist
  auth:
    # jwt-secret 은 application-local.yml 에 있다 (32바이트 이상)
    # 로그인 유지 기간.
    token-ttl: 1h
    # 이메일 인증 링크 유효 기간
    verification-ttl: 30m
    # 인증 메일에 넣을 링크의 앞부분.
    #
    # 여기에는 기본값만 둔다. 팀원 브라우저가 실제로 여는 주소는 환경마다
    # 다르고 유동 IP라 바뀌기도 하는데, 그 값을 여기 적으면 바뀔 때마다
    # 커밋해야 하고 공개 저장소에 운영 서버 주소가 그대로 남는다.
    #
    # 다른 PC 에서 접속해야 한다면 application-local.yml 에서 덮어쓴다.
    # 그러면 주소가 바뀌어도 각자 로컬 파일만 고치면 되고 커밋할 것이 없다.
    base-url: http://localhost:60921
  mail:
    # 발신 주소. 비우면 메일을 보내지 않고 인증 링크를 로그에 남긴다.
    # 실제 발송하려면 여기와 application-local.yml 의 spring.mail 을 채운다.
    from: ""
  order:
    # 주문 후 리뷰를 쓸 수 있는 기간.
    #
    # 1m 이었으나 실사용이 불가능해 10m 으로 늘렸다 — AI 판정에만 3~3.5초가
    # 걸리고, 그 앞에 사진을 찍고 별점을 고르고 후기를 10자 이상 쓰는 시간이
    # 붙는다. 실제로 60초 제한에서는 주문 네 건 중 세 건이 작성 도중 만료돼
    # 티켓만 소멸했다.
    #
    # 프론트는 서버가 계산해 내려준 마감 시각을 그대로 표시하므로 이 줄만 고치면 된다.
    review-ttl: 10m
  ai:
    # AI 서버 주소. 로컬 개발 기본값만 두고, 다른 PC 에서 띄운 경우는
    # application-local.yml 에서 덮어쓴다(auth.base-url 과 같은 이유).
    server-url: http://localhost:8000/similarity
    # 500장 실측 기준 최대 응답 시간이 3.5초였다. 넉넉히 여유를 둔다.
    timeout: 10s
    match-threshold: 0.80
  upload:
    dir: ./uploads
    base-url: /uploads
    target-long-edge: 1920
  review:
    content-min-length: 10
    content-max-length: 50
    # upload.target-long-edge 와 같은 값이어야 한다 — 하한과 목표치가 같아야
    # 리사이즈가 항상 줄이기만 하고 늘리는 일이 없다.
    min-image-long-edge: 1920
  store:
    # 홈 가게 목록 맨 위에 고정할 가게. 비우면 최신순 그대로.
    pinned-name: "썬더치킨 별내점"
  cors:
    # 쿠키를 쓰지 않고 Authorization 헤더로만 인증하므로(allowCredentials 꺼짐)
    # 출처를 전부 열어도 쿠키 기반 CSRF 같은 위험이 생기지 않는다.
    # 팀원이 localhost, LAN IP, 이 서버의 공인 IP 등 어디서 접속하든
    # 매번 목록에 추가할 필요 없게 전부 허용한다.
    allowed-origins:
      - "*"
logging:
  level:
    org.hibernate.SQL: debug
